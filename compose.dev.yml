services:
  api:
    build:
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - .:/src:ro        # source read-only to the container
      - /src/bin         # anonymous, writable, isolated build output
      - /src/obj         # anonymous, writable, isolated restore/build cache
    command: dotnet watch run src/jobbly.Api --no-launch-profile
